services:
  - type: web
    name: houseboard-family-finance
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: houseboard-family-finance-db
          property: connectionString

databases:
  - name: houseboard-family-finance-db
    plan: free
